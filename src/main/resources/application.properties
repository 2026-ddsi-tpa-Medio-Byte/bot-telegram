# El bot no expone HTTP: corre como proceso de consola (long-polling a Telegram)
spring.main.web-application-type=none
spring.main.banner-mode=off

# Token del bot de Telegram (obtener de @BotFather). Requerido para arrancar.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# URL del módulo Donadores y Entidades (local o Render)
donadores.url=${DONADORES_URL:http://localhost:8080}

# URL del módulo Donaciones: hace falta para que un donador pueda donar desde el bot
donaciones.url=${DONACIONES_URL:https://donatrack-donaciones.onrender.com}

# Depósito al que van las donaciones hechas desde el bot
deposito.default=${DEPOSITO_DEFAULT:DEP-UTN-01}

logging.level.root=INFO
